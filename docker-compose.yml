# Local environment for Servora.
#
#   docker compose up --build          # db, mailpit, migrate (once), web, worker, css
#   docker compose run --rm test       # full test suite inside the container
#
# Values come from .env (copy .env.example). Defaults below are local-only.
name: servora

x-app: &app
  build:
    context: .
    target: development
  image: servora-development:local
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment: &app-env
    RAILS_ENV: development
    DB_HOST: db
    DB_PORT: "5432"
    DB_OWNER_USER: ${DB_OWNER_USER:-servora_owner}
    DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-servora_owner_local}
    DB_APP_USER: ${DB_APP_USER:-servora_app}
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:-servora_app_local}
    SMTP_ADDRESS: mailpit
    SMTP_PORT: "1025"
    APP_HOST: ${APP_HOST:-localhost:3000}
    PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-simulator}
    ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
    METRICS_TOKEN: ${METRICS_TOKEN:-local-metrics-token}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    # Demo mode (off unless SERVORA_DEMO=1 in .env); the inbox link points to the local Mailpit.
    SERVORA_DEMO: ${SERVORA_DEMO:-0}
    SERVORA_DEMO_INBOX_URL: ${SERVORA_DEMO_INBOX_URL:-http://localhost:${MAILPIT_UI_PORT:-58025}}
    # Seeds (migrate runs bin/db-prepare --seed): demonstration history on by
    # default locally; the shared password is shown on the sign-in page in demo mode.
    SEED_DEMO_ACTIVITY: ${SEED_DEMO_ACTIVITY:-1}
    SEED_PASSWORD: ${SEED_PASSWORD:-servora-demo-2026}
  volumes:
    - .:/rails
    - storage:/rails/storage
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      POSTGRES_DB: postgres
      SERVORA_DB_OWNER_USER: ${DB_OWNER_USER:-servora_owner}
      SERVORA_DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-servora_owner_local}
      SERVORA_DB_APP_USER: ${DB_APP_USER:-servora_app}
      SERVORA_DB_APP_PASSWORD: ${DB_APP_PASSWORD:-servora_app_local}
    ports:
      - "${DB_PUBLISHED_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/setup/create_roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "${MAILPIT_UI_PORT:-58025}:8025"
      - "${MAILPIT_SMTP_PORT:-51025}:1025"

  migrate:
    <<: *app
    command: ["ruby", "bin/db-prepare", "--seed"]
    restart: "no"

  web:
    <<: *app
    command: ["ruby", "bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/up"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app
    command: ["ruby", "bin/jobs"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  css:
    <<: *app
    command: ["ruby", "bin/rails", "tailwindcss:watch[always]"]
    depends_on: []
    tty: true

  test:
    <<: *app
    profiles: ["test"]
    environment:
      <<: *app-env
      RAILS_ENV: test
      # Specs switch demo mode and the demonstration history on explicitly where they need them.
      SERVORA_DEMO: "0"
      SERVORA_DEMO_INBOX_URL: ""
      SEED_DEMO_ACTIVITY: "0"
    # bin/test-all is a bash script (the checkout may not keep the executable bit).
    command: ["bash", "bin/test-all"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
