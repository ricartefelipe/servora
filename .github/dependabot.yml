version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: docker
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
