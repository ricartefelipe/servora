# Recurring tasks executed by the Solid Queue scheduler (bin/jobs).
default: &default
  outbox_dispatch:
    class: Outbox::DispatchJob
    queue: outbox
    schedule: every 10 seconds

  payment_reconciliation:
    class: Payments::ReconcileJob
    queue: integrations
    schedule: every 5 minutes

  preventive_generation:
    class: Preventive::GenerateDueJob
    queue: default
    schedule: every day at 01:30

  sla_scan:
    class: Sla::ScanJob
    queue: default
    schedule: every 5 minutes

  invoice_reconciliation:
    class: Invoices::ReconcileJob
    queue: integrations
    schedule: every 10 minutes

  subscription_billing:
    class: Subscriptions::BillingJob
    queue: default
    schedule: every day at 02:00

  quote_expiry:
    class: Quotes::ExpireJob
    queue: default
    schedule: every day at 00:15

<%# Demo mode only (SERVORA_DEMO=1, with SEED_DEMO_ACTIVITY on, as for the seeds): today's story advances as its
    time comes (docs/RUNBOOKS.md, "Demonstração pública"), on the "demo" queue served by its own single-thread
    worker (config/queue.yml). The job checks the same variables and does nothing without them. %>
<% if ENV["SERVORA_DEMO"] == "1" && ENV.fetch("SEED_DEMO_ACTIVITY", Rails.env.development? ? "1" : "0") == "1" %>
  demo_story_advance:
    class: Demo::AdvanceStoryJob
    queue: demo
    schedule: every 5 minutes
<% end %>

development:
  <<: *default

production:
  <<: *default
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
