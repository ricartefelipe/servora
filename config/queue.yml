default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [outbox, default, mailers, integrations]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.5
<%# Demo mode only (SERVORA_DEMO=1): Demo::AdvanceStoryJob moves the clock of its own process (travel_to) while it
    applies the story, so it runs alone, in a single-thread worker process that serves nothing else; the clock of
    the other jobs and of their heartbeats is never touched (docs/RUNBOOKS.md, "Demonstração pública"). %>
<% if ENV["SERVORA_DEMO"] == "1" %>
    - queues: [demo]
      threads: 1
      processes: 1
      polling_interval: 5
<% end %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
